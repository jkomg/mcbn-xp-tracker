{% extends "base.html" %}

{% block public_content %}
<div class="container">
  <div class="row justify-content-center">
    <div class="col-md-5 col-lg-4">
      <div class="card login-card mt-5">
        <div class="card-header text-center">
          <h4 class="mb-1">Music City by Night</h4>
          <p class="text-muted mb-0">Staff Login</p>
        </div>
        <div class="card-body">
          <form method="POST" action="{{ url_for('dashboard.login_post') }}">
            <div class="mb-3">
              <label for="staff_name" class="form-label">Your Name</label>
              <input type="text" class="form-control" id="staff_name" name="staff_name" required>
            </div>
            <div class="mb-3">
              <label for="password" class="form-label">Password</label>
              <input type="password" class="form-control" id="password" name="password" required>
            </div>
            <div class="d-grid">
              <button type="submit" class="btn btn-danger">Sign In</button>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
