name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      web: ${{ steps.filter.outputs.web }}
      bot: ${{ steps.filter.outputs.bot }}
      contract: ${{ steps.filter.outputs.contract }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Detect changed paths
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            web:
              - 'apps/web/**'
              - 'packages/**'
              - '.github/workflows/ci.yml'
            bot:
              - 'apps/bot/**'
              - 'packages/**'
              - '.github/workflows/ci.yml'
            contract:
              - 'packages/api-contract/**'
              - 'packages/rules/**'
              - '.github/workflows/ci.yml'

  web-test-and-lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: detect-changes
    if: needs.detect-changes.outputs.web == 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python (web)
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: apps/web/requirements.txt

      - name: Install web dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r apps/web/requirements.txt
          pip install ruff

      - name: Lint web (ruff)
        run: ruff check apps/web/app apps/web/tests

      - name: Run web tests
        run: cd apps/web && pytest -q

      - name: Compile web sanity check
        run: python -m compileall apps/web/app apps/web/tests

  bot-test-and-lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: detect-changes
    if: needs.detect-changes.outputs.bot == 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node (bot)
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/bot/package-lock.json

      - name: Install bot dependencies
        run: cd apps/bot && npm ci

      - name: Run bot checks
        run: cd apps/bot && npm run check

  contract-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: detect-changes
    if: needs.detect-changes.outputs.contract == 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Validate shared JSON files
        run: |
          python -m json.tool packages/api-contract/spend_categories.json >/dev/null
          python -m json.tool packages/rules/xp_costs.json >/dev/null

      - name: Setup Python (contract)
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: apps/web/requirements.txt

      - name: Run web contract test
        run: |
          python -m pip install --upgrade pip
          pip install -r apps/web/requirements.txt
          cd apps/web && pytest -q tests/test_shared_contract.py

      - name: Setup Node (contract)
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/bot/package-lock.json

      - name: Run bot contract test
        run: |
          cd apps/bot
          npm ci
          npm run test -- src/__tests__/sharedContract.test.ts

  test-and-lint:
    runs-on: ubuntu-latest
    needs:
      - web-test-and-lint
      - bot-test-and-lint
      - contract-tests
    if: always()
    steps:
      - name: Enforce required-check result
        run: |
          RESULTS="${{ join(needs.*.result, ',') }}"
          echo "Job results: ${RESULTS}"
          if echo "${RESULTS}" | grep -Eq 'failure|cancelled'; then
            echo "One or more required jobs failed."
            exit 1
          fi
          echo "All required jobs passed or were skipped."
