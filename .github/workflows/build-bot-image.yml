# Builds and publishes the bot image the k3s cluster runs.
#
# This replaces "Deploy Bot to Ursula", which pushed code to a self-hosted runner
# on ursula and restarted a Docker container there. The bot moved to k3s on
# 2026-08-28 and is managed by Argo CD from the home-automation repo, so that
# workflow no longer deployed anything -- it would have started a SECOND live bot
# on ursula holding the same Discord gateway session as the pod.
#
# Deliberately NOT a deploy. home-automation pins images by commit SHA and Argo
# syncs from its main, so shipping bot code is two steps: this workflow publishes
# ghcr.io/jkomg/lasombra-bot:<sha7>, then someone bumps the tag in
# cluster/apps/lasombra-bot/deployment.yaml. Nothing here can restart the bot,
# which is the point -- one mechanism owns what runs, and it is Argo.
name: Build Bot Image

# The run's name carries the SHA it actually built, because the relevance check
# below has to look that up on later runs and no API field reports it. A
# workflow_run run's headSha is the default branch tip when the run was created,
# which is NOT necessarily the commit it checked out: if B lands on main while
# CI for A is still going, A's build run can be recorded against B.
run-name: Build Bot Image for ${{ github.event.workflow_run.head_sha || inputs.sha || github.sha }}

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      reason:
        description: 'Reason for manual build'
        required: false
        default: 'manual trigger'
      sha:
        description: 'Commit to build (default: the ref this was dispatched from)'
        required: false
        default: ''
      overwrite:
        description: 'Replace tags that already exist (changes what a pinned manifest resolves to)'
        required: false
        type: boolean
        default: false

concurrency:
  group: build-bot-image
  cancel-in-progress: false

jobs:
  build:
    name: Build and publish
    runs-on: ubuntu-latest
    # Generous because linux/arm64 is built under QEMU on an amd64 runner, where
    # npm install is pathologically slow: the first run of this workflow was
    # killed at exactly 30m15s, mid-"Build and push base image", with no error in
    # the log -- a job that exceeds timeout-minutes is reported as "cancelled",
    # which reads exactly like somebody pressed stop. The real fix is building
    # arm64 natively rather than emulated; until then this must not be tighter
    # than a cold-cache emulated build.
    timeout-minutes: 90
    if: |
      github.repository == 'jkomg/mcbn-xp-tracker' && (
        github.event_name == 'workflow_dispatch' ||
        github.event.workflow_run.conclusion == 'success'
      )
    permissions:
      contents: read
      packages: write
      # gh run list, for the relevance comparison below.
      actions: read

    steps:
      - name: Resolve build SHA
        id: sha
        run: |
          if [ "${{ github.event_name }}" = "workflow_run" ]; then
            full="${{ github.event.workflow_run.head_sha }}"
          elif [ -n "${{ inputs.sha }}" ]; then
            # Rebuilding an arbitrary commit -- typically one older than this
            # workflow. gh's --ref takes a branch or tag and reads the workflow
            # from there, so an old SHA cannot be dispatched directly; this input
            # is what makes rebuilding one possible at all.
            full="${{ inputs.sha }}"
          else
            full="${{ github.sha }}"
          fi
          echo "full=$full" >> "$GITHUB_OUTPUT"
          echo "short=${full:0:7}" >> "$GITHUB_OUTPUT"

      - name: Check out the resolved SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.sha.outputs.full }}
          # Full history: the relevance check below diffs against the last commit
          # this workflow built, which can be arbitrarily far back.
          fetch-depth: 0

      # The build context is the commit being built, which for a rebuild of an old
      # commit predates .github/docker/Dockerfile.packages -- so take the wrapper
      # from the ref this workflow is running from, not from the tree being built.
      - name: Check out this workflow's own ref for the wrapper Dockerfile
        uses: actions/checkout@v4
        with:
          path: .workflow-ref
          fetch-depth: 1

      # An image per main commit would be mostly duplicates, so skip when nothing
      # the bot ships changed.
      #
      # The comparison point is the head SHA of the last successful run of THIS
      # workflow, not HEAD~1. A push can carry several commits -- a rebase merge,
      # or a batch landing at once -- and diffing only the last commit would call
      # the push irrelevant whenever the final commit happens to touch nothing the
      # bot ships, silently publishing no image for a SHA that CI passed on. Runs
      # that skipped the build are still valid comparison points: they established
      # that nothing bot-relevant changed up to that commit, so the gap they leave
      # behind cannot contain a bot change.
      #
      # Fails open on any error, and on the first ever run: a redundant build is
      # cheaper than silently never publishing, which is the failure mode that
      # leaves a SHA bump pointing at a tag that does not exist.
      - name: Check whether bot-relevant paths changed
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "relevant=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Read the SHA the last successful run BUILT, out of its run name --
          # not its headSha, which reports the default branch tip at the moment
          # that run was created and can therefore name a commit the run never
          # touched.
          last_built=$(gh run list \
            --workflow=build-bot-image.yml \
            --status success \
            --limit 20 \
            --json displayTitle \
            --jq '[.[].displayTitle | capture("for (?<sha>[0-9a-f]{40})")? | .sha][0] // empty' 2>/dev/null) || last_built=""

          # Fail open unless the comparison point is a real commit AND an ancestor
          # of what we are building. Anything else -- a force-push, or two CI runs
          # finishing out of order so the last build is NEWER than this commit --
          # means the diff would not describe "changed since that image", so build.
          if [ -z "$last_built" ] \
            || ! git cat-file -e "${last_built}^{commit}" 2>/dev/null \
            || ! git merge-base --is-ancestor "$last_built" HEAD 2>/dev/null; then
            echo "relevant=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          diff_output=$(git diff --name-only "$last_built" HEAD) || diff_output="__DIFF_FAILED__"
          if [ "$diff_output" = "__DIFF_FAILED__" ]; then
            echo "relevant=true" >> "$GITHUB_OUTPUT"
          # The wrapper Dockerfile and this workflow both define what gets
          # published, so a change to either has to produce a new tag.
          elif echo "$diff_output" | grep -qE '^(apps/bot/|packages/|\.github/docker/Dockerfile\.packages|\.github/workflows/build-bot-image\.yml)'; then
            echo "relevant=true" >> "$GITHUB_OUTPUT"
          else
            echo "relevant=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up QEMU
        if: steps.check.outputs.relevant != 'false'
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        if: steps.check.outputs.relevant != 'false'
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: steps.check.outputs.relevant != 'false'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The manifests in home-automation pin by TAG, not digest, and apps/bot's
      # Dockerfile builds FROM the mutable node:20-alpine -- so rebuilding a commit
      # whose tag already exists silently changes the bytes a pinned workload pulls
      # on its next reschedule. That is the "pushing over an existing tag leaves the
      # manifest lying about what runs" case their handoff doc warns about, and it
      # applies to BOTH packages: the motivating rebuild is b37eb50, which is exactly
      # the tag the dev bot is pinned to right now.
      #
      # So: never replace a tag that exists. Re-running a build for a SHA already
      # published becomes a no-op rather than a failure, which keeps CI re-runs
      # harmless; a deliberate replacement needs the overwrite input, where the
      # person setting it has to have read what it does.
      - name: Refuse to overwrite tags that already exist
        id: tags
        if: steps.check.outputs.relevant != 'false'
        env:
          SHORT: ${{ steps.sha.outputs.short }}
        run: |
          existing=""
          for ref in \
            "lasombra-bot:${SHORT}-base" "zapathasura:${SHORT}-base" \
            "lasombra-bot:${SHORT}" "zapathasura:${SHORT}"; do
            if out=$(docker manifest inspect "ghcr.io/jkomg/$ref" 2>&1); then
              existing="$existing $ref"
            else
              # Only a clear "no such manifest" counts as absent. Any other error --
              # registry blip, auth trouble -- is treated as present, because the one
              # thing this step must never do is mistake "could not tell" for "safe to
              # overwrite".
              case "$out" in
                *"manifest unknown"*|*"MANIFEST_UNKNOWN"*|*"NAME_UNKNOWN"*|*"not found"*) : ;;
                *) echo "::warning::could not determine whether $ref exists, assuming it does: $out"
                   existing="$existing $ref" ;;
              esac
            fi
          done

          if [ -z "$existing" ]; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
          elif [ "${{ inputs.overwrite }}" = "true" ]; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
            {
              echo "### Replacing existing tags"
              echo
              echo "\`overwrite\` was set, so these are being republished:"
              for ref in $existing; do echo "- \`ghcr.io/jkomg/$ref\`"; done
              echo
              echo "Anything pinned to them resolves to different bytes after its next pull."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "publish=false" >> "$GITHUB_OUTPUT"
            {
              echo "### Already published — nothing to do"
              echo
              for ref in $existing; do echo "- \`ghcr.io/jkomg/$ref\`"; done
              echo
              echo "Re-run with \`overwrite: true\` only if you intend a pinned manifest to resolve to different bytes."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      # Two images, matching what the cluster manifests already describe: :<sha>-base
      # is the app, :<sha> adds /packages on top. See .github/docker/Dockerfile.packages.
      #
      # The cluster nodes are arm64 and ursula is amd64; both are built so the image
      # stays runnable wherever it lands.
      - name: Build and push base image
        if: steps.check.outputs.relevant != 'false' && steps.tags.outputs.publish != 'false'
        uses: docker/build-push-action@v7
        with:
          context: ./apps/bot
          file: ./apps/bot/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/jkomg/lasombra-bot:${{ steps.sha.outputs.short }}-base
            ghcr.io/jkomg/zapathasura:${{ steps.sha.outputs.short }}-base
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push wrapper image
        if: steps.check.outputs.relevant != 'false' && steps.tags.outputs.publish != 'false'
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./.workflow-ref/.github/docker/Dockerfile.packages
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: BASE=ghcr.io/jkomg/lasombra-bot:${{ steps.sha.outputs.short }}-base
          # zapathasura is not a different application: it is this same code at a
          # different commit, built from this same Dockerfile. Two digests for
          # byte-identical content would invent a distinction the artifacts do not
          # have, so one build carries both tags. This publishes only -- the dev
          # bot's manifest stays pinned wherever it is until someone bumps it.
          tags: |
            ghcr.io/jkomg/lasombra-bot:${{ steps.sha.outputs.short }}
            ghcr.io/jkomg/zapathasura:${{ steps.sha.outputs.short }}

      - name: Summarise the bump this needs
        if: steps.check.outputs.relevant != 'false' && steps.tags.outputs.publish != 'false'
        env:
          SHORT: ${{ steps.sha.outputs.short }}
        run: |
          {
            echo "### Bot image published"
            echo
            echo '`ghcr.io/jkomg/lasombra-bot:'"$SHORT"'`'
            echo '`ghcr.io/jkomg/zapathasura:'"$SHORT"'` — same digest, dev bot'
            echo
            echo "Not deployed. To ship it, in **home-automation**:"
            echo
            echo '```'
            echo "cluster/apps/lasombra-bot/deployment.yaml  ->  image: ghcr.io/jkomg/lasombra-bot:$SHORT"
            echo "cluster/apps/zapathasura/deployment.yaml   ->  image: ghcr.io/jkomg/zapathasura:$SHORT   (only if bumping dev)"
            echo '```'
            echo
            echo "Commit to its main; Argo CD syncs and recreates the pod."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Notify Discord
        if: always() && steps.check.outputs.relevant != 'false'
        continue-on-error: true
        env:
          WEBHOOK: ${{ secrets.DISCORD_DEPLOY_WEBHOOK }}
          STATUS: ${{ job.status }}
          PUBLISHED: ${{ steps.tags.outputs.publish }}
          SHORT: ${{ steps.sha.outputs.short }}
          SHA: ${{ steps.sha.outputs.full }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          [ -z "$WEBHOOK" ] && exit 0

          COMMIT_URL="${{ github.server_url }}/${{ github.repository }}/commit/${SHA}"
          COMMIT_MSG=$(git log -1 --format="%s" "$SHA")

          # "cancelled" gets its own message because it is usually nobody's doing:
          # a job that exceeds timeout-minutes is reported as cancelled with no
          # error in the log, and calling that "failed" sends whoever reads it
          # hunting for a build error that does not exist.
          if [ "$STATUS" = "success" ] && [ "$PUBLISHED" = "false" ]; then
            COLOR=10070709
            ICON="↩️"
            TITLE="Bot image already published"
            BODY="[\`${SHORT}\`](${COMMIT_URL}) was not rebuilt — its tags already exist on GHCR, so nothing was replaced. [View run](${RUN_URL}).\n${COMMIT_MSG}"
          elif [ "$STATUS" = "success" ]; then
            COLOR=3066993
            ICON="📦"
            TITLE="Bot image published"
            BODY="[\`${SHORT}\`](${COMMIT_URL}) is on GHCR. Not live yet — bump the tag in home-automation to deploy.\n${COMMIT_MSG}"
          elif [ "$STATUS" = "cancelled" ]; then
            COLOR=16098851
            ICON="⏱️"
            TITLE="Bot image build stopped"
            BODY="[\`${SHORT}\`](${COMMIT_URL}) did not publish — the job was cancelled. Check the elapsed time against \`timeout-minutes\` before assuming someone pressed stop. [View logs](${RUN_URL}).\n${COMMIT_MSG}"
          else
            COLOR=15158332
            ICON="❌"
            TITLE="Bot image build failed"
            BODY="[\`${SHORT}\`](${COMMIT_URL}) did not publish. [View logs](${RUN_URL}).\n${COMMIT_MSG}"
          fi

          curl -s -X POST "$WEBHOOK" \
            -H "Content-Type: application/json" \
            -d "{\"embeds\":[{\"title\":\"${ICON} ${TITLE}\",\"description\":\"${BODY}\",\"color\":${COLOR}}]}"
