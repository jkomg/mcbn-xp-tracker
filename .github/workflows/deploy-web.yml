name: Deploy Web to Cloud Run

on:
  workflow_run:
    workflows: ["Deploy Web to Cloud Run (Dev)"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

# Prod deploys must not overlap. Two chains finishing close together were free
# to build and push concurrently, and whichever `gcloud run deploy` landed last
# won — which is not necessarily the newer commit.
concurrency:
  group: deploy-web-prod
  cancel-in-progress: false

jobs:
  deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: |
      github.repository == 'jkomg/mcbn-xp-tracker' &&
      (github.event_name == 'workflow_dispatch' ||
       github.event.workflow_run.conclusion == 'success')

    env:
      REGION: us-central1
      SERVICE_NAME: mcbn-xp-tracker
      REGISTRY: us-central1-docker.pkg.dev/mcbn-xp-tracker/mcbn-repo/mcbn-xp-tracker

    steps:
      # This workflow is triggered by the dev deploy finishing, and it builds
      # that run's commit — not whatever main points at now. When merges land
      # close together those differ, so a run triggered by an older commit's dev
      # deploy would rebuild and redeploy that older commit, even though a newer
      # one is already on main. Production went backwards a step, and the check
      # on the *newer* commit went green while shipping the older one.
      #
      # A superseded run now stops here. The newer commit has its own chain and
      # will deploy itself, so skipping loses nothing and keeps the green check
      # honest about what is live.
      - name: Resolve deploy SHA
        id: sha
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_run" ]; then
            SHA="${{ github.event.workflow_run.head_sha }}"
          else
            SHA="${{ github.sha }}"
          fi
          TIP=$(gh api "repos/${{ github.repository }}/commits/main" --jq .sha)
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"

          # A manual dispatch is deliberate — a rollback, say — so it always proceeds.
          if [ "${{ github.event_name }}" != "workflow_run" ] || [ "$SHA" = "$TIP" ]; then
            echo "superseded=false" >> "$GITHUB_OUTPUT"
            echo "Deploying $SHA" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "superseded=true" >> "$GITHUB_OUTPUT"
            {
              echo "### Skipped — superseded"
              echo "This run would have deployed \`$SHA\`, but main is now at \`$TIP\`."
              echo "That commit has its own deploy chain; deploying here would ship an older build."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Checkout
        if: steps.sha.outputs.superseded == 'false'
        uses: actions/checkout@v7
        with:
          ref: ${{ steps.sha.outputs.sha }}

      - name: Authenticate to GCP
        if: steps.sha.outputs.superseded == 'false'
        uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up gcloud CLI
        if: steps.sha.outputs.superseded == 'false'
        uses: google-github-actions/setup-gcloud@v3

      - name: Configure Docker for Artifact Registry
        if: steps.sha.outputs.superseded == 'false'
        run: gcloud auth configure-docker us-central1-docker.pkg.dev --quiet

      - name: Build image (linux/amd64 for Cloud Run)
        if: steps.sha.outputs.superseded == 'false'
        run: |
          docker build \
            --platform linux/amd64 \
            -f apps/web/Dockerfile \
            -t ${{ env.REGISTRY }}:${{ steps.sha.outputs.sha }} \
            -t ${{ env.REGISTRY }}:latest \
            .

      - name: Push image to Artifact Registry
        if: steps.sha.outputs.superseded == 'false'
        run: |
          docker push ${{ env.REGISTRY }}:${{ steps.sha.outputs.sha }}
          docker push ${{ env.REGISTRY }}:latest

      - name: Deploy to Cloud Run
        if: steps.sha.outputs.superseded == 'false'
        run: |
          gcloud run deploy ${{ env.SERVICE_NAME }} \
            --image ${{ env.REGISTRY }}:${{ steps.sha.outputs.sha }} \
            --region ${{ env.REGION }} \
            --platform managed \
            --allow-unauthenticated \
            --memory 512Mi \
            --cpu 1 \
            --min-instances 0 \
            --max-instances 2 \
            --concurrency 80 \
            --timeout 120 \
            --cpu-throttling \
            --no-session-affinity \
            --startup-probe "httpGet.path=/api/health,httpGet.port=8080,initialDelaySeconds=0,timeoutSeconds=5,periodSeconds=5,failureThreshold=30" \
            --set-env-vars "FLASK_DEBUG=false" \
            --set-env-vars "SPREADSHEET_ID=${{ secrets.SPREADSHEET_ID }}" \
            --set-env-vars "SHEETS_CACHE_TTL=30" \
            --set-env-vars "AUTO_CREATE_PERIODS_ENABLED=true" \
            --set-env-vars "BOT_API_REPLAY_PROTECTION_ENABLED=true" \
            --set-env-vars "DISCORD_REDIRECT_URI=https://mcbn.jkomg.us/auth/callback" \
            --set-env-vars "CLOUD_SPEND_BILLING_TABLE=${{ secrets.CLOUD_SPEND_BILLING_TABLE }}" \
            --set-env-vars "CLOUD_SPEND_BILLING_PROJECT_ID=${{ secrets.CLOUD_SPEND_BILLING_PROJECT_ID }}" \
            --update-secrets "FLASK_SECRET_KEY=mcbn-flask-secret:latest" \
            --update-secrets "GOOGLE_CREDENTIALS_JSON=mcbn-google-creds:latest" \
            --update-secrets "DISCORD_CLIENT_ID=mcbn-discord-client-id:latest" \
            --update-secrets "DISCORD_CLIENT_SECRET=mcbn-discord-client-secret:latest" \
            --update-secrets "ALLOWED_DISCORD_IDS=mcbn-discord-allowed-ids:latest" \
            --update-secrets "SETTINGS_ADMIN_DISCORD_IDS=mcbn-settings-admin-ids:latest" \
            --update-secrets "CLOUD_SPEND_ADMIN_DISCORD_IDS=mcbn-cloud-spend-admin-ids:latest" \
            --update-secrets "WEB_APP_API_TOKEN=mcbn-web-app-api-token:latest" \
            --update-secrets "WEB_APP_API_READ_TOKEN=mcbn-web-app-api-read-token:latest" \
            --update-secrets "WEB_APP_API_WRITE_TOKEN=mcbn-web-app-api-write-token:latest" \
            --update-secrets "DATABASE_URL=mcbn-database-url:latest" \
            --update-secrets "TURSO_AUTH_TOKEN=mcbn-turso-auth-token:latest" \
            --update-secrets "DISCORD_WEBHOOK_URL=mcbn-discord-webhook-url:latest"

      - name: Route 100% traffic to latest revision
        if: steps.sha.outputs.superseded == 'false'
        run: |
          gcloud run services update-traffic ${{ env.SERVICE_NAME }} \
            --region ${{ env.REGION }} \
            --to-latest

      - name: Print deployed URL
        if: steps.sha.outputs.superseded == 'false'
        run: |
          gcloud run services describe ${{ env.SERVICE_NAME }} \
            --region ${{ env.REGION }} \
            --format="value(status.url)"

      - name: Notify Discord
        # Not on a superseded run: nothing was deployed, and announcing "live"
        # for a build that never happened is exactly the confusion this change
        # exists to remove.
        if: always() && steps.sha.outputs.superseded == 'false'
        continue-on-error: true
        env:
          WEBHOOK: ${{ secrets.DISCORD_DEPLOY_WEBHOOK }}
          STATUS: ${{ job.status }}
          SHA: ${{ steps.sha.outputs.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          TRIGGER: ${{ github.event_name }}
        run: |
          [ -z "$WEBHOOK" ] && exit 0

          SHORT_SHA="${SHA:0:7}"
          COMMIT_URL="${{ github.server_url }}/${{ github.repository }}/commit/${SHA}"
          COMMIT_MSG=$(git log -1 --format="%s" "$SHA")

          if [ "$STATUS" = "success" ]; then
            COLOR=3066993
            ICON="✅"
            TITLE="Web deployed"
            BODY="[\`${SHORT_SHA}\`](${COMMIT_URL}) is live on Cloud Run.\n${COMMIT_MSG}"
          else
            COLOR=15158332
            ICON="❌"
            TITLE="Deploy failed"
            BODY="[\`${SHORT_SHA}\`](${COMMIT_URL}) did not deploy. [View logs](${RUN_URL}).\n${COMMIT_MSG}"
          fi

          curl -s -X POST "$WEBHOOK" \
            -H "Content-Type: application/json" \
            -d "{
              \"embeds\": [{
                \"title\": \"${ICON} ${TITLE}\",
                \"description\": \"${BODY}\",
                \"color\": ${COLOR},
                \"footer\": { \"text\": \"triggered by ${TRIGGER}\" }
              }]
            }"
