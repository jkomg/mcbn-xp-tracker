name: Deploy

on:
  push:
    branches: [main]
    paths:
      - 'apps/web/**'
      - 'packages/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment'
        required: true
        default: 'dev'
        type: choice
        options:
          - dev
          - prod

jobs:
  deploy:
    name: Deploy to ${{ github.event_name == 'push' && 'dev' || inputs.environment }}
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      PROJECT: mcbn-xp-tracker
      REGION: us-central1
      REPO: mcbn-repo
      TARGET: ${{ github.event_name == 'push' && 'dev' || inputs.environment }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev --quiet

      - name: Determine image tag and service name
        id: vars
        run: |
          SHA="${{ github.sha }}"
          if [[ "$TARGET" == "prod" ]]; then
            SERVICE="mcbn-xp-tracker"
            IMAGE="${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT }}/${{ env.REPO }}/mcbn-xp-tracker:${SHA}"
          else
            SERVICE="mcbn-xp-tracker-dev"
            IMAGE="${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT }}/${{ env.REPO }}/mcbn-xp-tracker-dev:${SHA}"
          fi
          echo "service=$SERVICE" >> $GITHUB_OUTPUT
          echo "image=$IMAGE" >> $GITHUB_OUTPUT

      - name: Build and push image
        run: |
          docker build -t ${{ steps.vars.outputs.image }} apps/web/
          docker push ${{ steps.vars.outputs.image }}

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy ${{ steps.vars.outputs.service }} \
            --image=${{ steps.vars.outputs.image }} \
            --project=${{ env.PROJECT }} \
            --region=${{ env.REGION }} \
            --quiet

      - name: Notify Discord
        if: always()
        env:
          WEBHOOK: ${{ secrets.DISCORD_DEPLOY_WEBHOOK }}
          STATUS: ${{ job.status }}
          SHA: ${{ github.sha }}
          ACTOR: ${{ github.actor }}
        run: |
          if [[ "$STATUS" == "success" ]]; then
            COLOR=3066993
            ICON="✅"
          else
            COLOR=15158332
            ICON="❌"
          fi
          SHORT_SHA="${SHA:0:7}"
          curl -sf -X POST "$WEBHOOK" \
            -H "Content-Type: application/json" \
            -d "{\"embeds\":[{\"title\":\"${ICON} Deploy ${STATUS}: ${TARGET}\",\"description\":\"[\`${SHORT_SHA}\`](https://github.com/${{ github.repository }}/commit/${SHA}) by **${ACTOR}**\",\"color\":${COLOR}}]}" || true
